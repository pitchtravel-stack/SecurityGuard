<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5fa;--card:#fff;--ink:#0f1b2d;--muted:#5d6b80;--line:#e1e7f0;
  --pri:#1d4ed8;--pri-d:#1e3a8a;--pri-50:#eaf1ff;
  --ok:#0e8a4f;--ok-50:#e5f5ec;--bad:#c62828;--bad-50:#fdeceb;--warn:#a85d00;--warn-50:#fff3df;
  --r:14px;--sh:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13.5px}.b{font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--pri-d),var(--pri));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top .t{font-weight:700;font-size:17px;line-height:1.1}.top .s{font-size:12.5px;opacity:.85}
.top .sp{flex:1}
.top .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.chip-u{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 10px;font-size:13.5px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 90px}
.wrap.wide{max-width:1180px}
/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:active{background:var(--pri-d)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--pri-d)}
.btn.soft{background:var(--pri-50);color:var(--pri-d)}
.btn.warn{background:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}.btn.big{min-height:58px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.55;cursor:wait}
.link{background:none;border:0;color:var(--pri);font-weight:600;cursor:pointer;padding:4px 0}
label.f{display:block;font-weight:600;font-size:14.5px;margin:14px 0 6px}
.req{color:var(--bad)}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;min-height:44px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-50)}
.seg{display:flex;background:var(--pri-50);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--pri-d);cursor:pointer}
.seg button.on{background:#fff;box-shadow:var(--sh)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2 button{border:2px solid var(--line);background:#fff;border-radius:12px;min-height:54px;font-weight:700;font-size:17px;cursor:pointer}
.seg2 button.on.ok{border-color:var(--ok);background:var(--ok-50);color:var(--ok)}
.seg2 button.on.bad{border-color:var(--bad);background:var(--bad-50);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;cursor:pointer;font-size:14.5px}
.chipb.on{border-color:var(--pri);background:var(--pri-50);color:var(--pri-d);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:13px;font-weight:600;background:#eef2f7;color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-50);color:var(--ok)}.pill.bad{background:var(--bad-50);color:var(--bad)}.pill.warn{background:var(--warn-50);color:var(--warn)}.pill.pri{background:var(--pri-50);color:var(--pri-d)}

/* --- โหมดส่งไว --- */
.ob{position:sticky;top:56px;z-index:18;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pri-50);color:var(--pri-d);padding:8px 16px;font-size:14px;font-weight:600}
.ob.bad{background:var(--bad-50);color:var(--bad)}
.dotspin{display:inline-block;width:12px;height:12px;border:2px solid rgba(29,78,216,.25);border-top-color:var(--pri);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px}
.cp{position:relative}.cp input,.nxbtn input,.ph-add-sm input{display:none}
.nxbtn{display:block;margin:14px 0 0;background:linear-gradient(135deg,#0e8a4f,#0b6f40);color:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:0 6px 18px rgba(14,138,79,.28)}
.nxbtn:active{transform:translateY(1px)}
.nx{display:grid;gap:2px}.nx-l{font-size:13.5px;opacity:.9}.nx-n{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}.nx-s{font-size:13px;opacity:.85}
.done-all{margin:14px 0 0;background:var(--ok-50);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.btn.ok{background:var(--ok);color:#fff}
.btn.water{background:#0e7490;color:#fff;margin-bottom:6px}.pill.water{background:#e0f2fe;color:#0e7490}.fi .dot.water{background:#0891b2}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:26px;font-weight:700;color:var(--pri-d);cursor:pointer}.stepper input{width:90px;text-align:center;font-size:24px;font-weight:700}
.wl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.wl:last-child{border-bottom:0}.wl .nm{flex:1;min-width:0}.wl .v{font-weight:700;white-space:nowrap}
.qshot{display:flex;gap:12px;margin:12px 0 16px}
.qshot img{width:40%;max-width:170px;border-radius:12px;border:1px solid var(--line);object-fit:cover}
.qshot>div{display:grid;gap:8px;align-content:start}
.ph-add-sm{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:var(--pri)}
.saved{background:var(--ok-50);color:var(--ok);border-radius:12px;padding:12px;font-weight:600;display:flex;align-items:center;gap:8px;margin:10px 0}
/* login */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 500px at 50% -10%,#cfe0ff,transparent),var(--bg)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.brand .logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;display:grid;place-items:center}
.brand .logo svg{width:30px;height:30px}
.brand-t{font-size:24px;font-weight:700;color:var(--pri-d);line-height:1.1}.brand-s{color:var(--muted);font-size:14px}
.login{width:100%;max-width:420px}
.staff-list{max-height:46vh;overflow:auto;display:grid;gap:8px;margin-top:10px}
.staff-btn{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;text-align:left;cursor:pointer}
.staff-btn:hover{border-color:var(--pri)}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri-50);color:var(--pri-d);display:grid;place-items:center;font-weight:700;flex:none}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:16px 0}
.pin-dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--pri);display:block}
.pin-dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:24px;font-weight:600;cursor:pointer}
.pad button:active{background:var(--pri-50)}
.pad .go{background:var(--pri);color:#fff;border-color:var(--pri);font-size:16px}
.demo{margin-top:14px;max-width:420px;width:100%;font-size:13.5px;background:#fff8e6;border:1px dashed #e2b659;border-radius:12px;padding:10px 12px;color:#6d4a00}
/* guard */
.hero{background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(29,78,216,.25)}
.hero .clock{font-size:46px;font-weight:700;letter-spacing:1px;line-height:1.1;margin:4px 0}
.hero .badge{background:#fff;color:var(--pri-d);border-radius:99px;padding:2px 12px;font-weight:700}
.hero .hs{opacity:.9;font-size:14.5px}
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin:10px 0 6px}
.prog>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.act2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
h3.sec{font-size:16px;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.cp-list{display:grid;gap:8px}
.cp{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.cp .n{font-weight:700}.cp .z{font-size:13.5px;color:var(--muted)}
.cp>div:nth-child(2){flex:1;min-width:0}
.cp .st{margin-left:auto;flex:none;max-width:48%;text-align:right}.cp .st .pill{white-space:normal}
.cp.todo{border-left:5px solid var(--pri)}
.cp.done{border-left:5px solid var(--ok);background:#fbfefc}
.cp.bad{border-left:5px solid var(--bad);background:#fffafa}
.cp.skip{opacity:.7;border-left:5px solid var(--line)}
.cp .num{width:34px;height:34px;border-radius:10px;background:var(--pri-50);color:var(--pri-d);display:grid;place-items:center;font-weight:700;flex:none}
.cp.done .num{background:var(--ok-50);color:var(--ok)}.cp.bad .num{background:var(--bad-50);color:var(--bad)}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.slot{border-radius:10px;padding:6px 2px;text-align:center;font-size:12.5px;background:#fff;border:1.5px solid var(--line)}
.slot b{display:block;font-size:14px}
.slot.full{background:var(--ok-50);border-color:#b8e2c9;color:var(--ok)}
.slot.part{background:var(--warn-50);border-color:#f0d19f;color:var(--warn)}
.slot.none{background:var(--bad-50);border-color:#f3c1bd;color:var(--bad)}
.slot.cur{border:2px solid var(--pri);color:var(--pri-d);background:var(--pri-50)}
.slot.fut{color:#a3adbb}
.feed{display:grid;gap:8px}
.fi{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fi .tm{font-weight:700;min-width:44px;color:var(--pri-d)}
.fi .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--ok)}
.fi .dot.bad{background:var(--bad)}.fi .dot.inc{background:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:18px;background:#fff;border:1px dashed var(--line);border-radius:12px}
/* photos */
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.ph-add{width:96px;height:96px;border-radius:12px;border:2px dashed #9db5e8;background:var(--pri-50);color:var(--pri-d);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.ph-add input{display:none}
.gallery img{width:100%;border-radius:12px;margin-bottom:10px;border:1px solid var(--line)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,27,45,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
.sheet.wide{max-width:1000px;height:94vh}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-hd h3{margin:0;font-size:18px;flex:1}
.x{border:0;background:#eef2f7;border-radius:10px;width:36px;height:36px;font-size:22px;cursor:pointer}
.sheet-bd{padding:4px 16px 20px;overflow:auto;flex:1}
.sheet.wide .sheet-bd{display:flex;flex-direction:column;padding-top:12px}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:20px}}
iframe.rep{flex:1;width:100%;min-height:60vh;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(92vw,420px)}
.tst{background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;box-shadow:var(--sh);animation:up .2s}
.tst.bad{background:var(--bad)}.tst.ok{background:var(--ok)}
.spin{width:28px;height:28px;border:3px solid var(--pri-50);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* admin */
.tabs{position:sticky;top:56px;z-index:15;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:0 12px}
.tabs button{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--pri-d);border-color:var(--pri)}
.pane-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pane-hd h2{margin:0;font-size:21px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi .l{font-size:14px;color:var(--muted);font-weight:600}.kpi .v{font-size:32px;font-weight:700;line-height:1.15}.kpi .d{font-size:13px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.pri .v{color:var(--pri-d)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--pri)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:10px}
.card h3{margin:0 0 10px;font-size:16px}
.bar{height:9px;border-radius:99px;background:#e9eef6;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:#e39b25}.bar.bad>i{background:var(--bad)}
.shiftc .cov{display:flex;align-items:center;gap:10px;margin:10px 0 4px}.shiftc .cov b{font-size:22px;min-width:56px;text-align:right}
.trend{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:18px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.tcol .tb{width:70%;max-width:38px;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.tcol .tv{font-size:12.5px;font-weight:700;color:var(--pri-d)}
.tcol .tl{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap}
.tcol .te{font-size:11.5px;color:var(--bad);font-weight:700;height:16px}
.hb{display:grid;grid-template-columns:1fr 2fr 36px;gap:8px;align-items:center;font-size:14.5px;margin:7px 0}
.hb .bar>i{background:var(--bad)}
.item{display:grid;gap:6px;margin-bottom:10px}
.item .t{font-weight:700;font-size:16.5px}
.item .fol{display:grid;grid-template-columns:170px 1fr auto;gap:8px;margin-top:4px}
.toolbar{position:sticky;top:104px;z-index:10;background:var(--bg);padding:8px 0;margin-bottom:6px}
.filters{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:end}
.filters label{font-size:13px;font-weight:600;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;vertical-align:middle}
table.t th{background:#f6f8fc;font-size:13.5px;color:var(--muted)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.inactive td{color:#9aa4b2}
@media(max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}.item .fol{grid-template-columns:1fr}
  .kpi .v{font-size:26px}.toolbar{top:100px}
}
@media(max-width:420px){.slots{grid-template-columns:repeat(4,1fr)}.hero .clock{font-size:40px}}
</style>
</head>

<script>
/* ================= ตั้งค่า ================= */
const UI_VERSION = 'v2.0 (26 พ.ย. 69)';   // ต้องตรงกับ APP_VERSION ใน Core.gs
/* ⚙️ URL ของ web app (ลงท้าย /exec) จาก Deploy > Manage deployments — ใช้เมื่อวางไฟล์นี้บน GitHub Pages */
const API_URL = 'https://script.google.com/macros/s/AKfycbwNDcUdQSHfrA2T_2vKd5xRPk6kr95GOe5i5goMh5zKcOKBsqr6N2D3vWfL4AzbtXj6/exec';
const VIA_GAS = !!(window.google && google.script && google.script.run);
const REMOTE = !VIA_GAS && /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL) && API_URL.indexOf('ใส่รหัส') < 0;
/* ลิงก์จาก QR จุดตรวจ (?cp=CP01) */
window.DEEP_CP = (new URLSearchParams(location.search).get('cp') || '').replace(/[^A-Za-z0-9_-]/g, '');
if (VIA_GAS && google.script.url) google.script.url.getLocation(l => { const v = (l.parameter && l.parameter.cp) || ''; if (v) window.DEEP_CP = String(v).replace(/[^A-Za-z0-9_-]/g, ''); });
/** กุญแจประจำเครื่อง (สุ่มครั้งแรกแล้วเก็บในเครื่อง) — ใช้ยืนยันว่าเป็นเครื่องที่หัวหน้าอนุมัติแล้ว */
function devKey() {
  try {
    let k = localStorage.getItem('sr_dev');
    if (!k || !/^[a-f0-9]{48}$/.test(k)) {
      const a = new Uint8Array(24); crypto.getRandomValues(a);
      k = Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
      localStorage.setItem('sr_dev', k);
    }
    return k;
  } catch (e) { return ''; }
}
function devName() {
  const u = navigator.userAgent;
  const os = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'อื่น ๆ';
  const br = /Line\//.test(u) ? 'LINE' : /Edg/.test(u) ? 'Edge' : /CriOS|Chrome/.test(u) ? 'Chrome' : /FxiOS|Firefox/.test(u) ? 'Firefox' : /Safari/.test(u) ? 'Safari' : '';
  return os + (br ? ' · ' + br : '');
}
</script>

function call(action, payload) {
  return new Promise((resolve, reject) => {
    const done = (raw) => {
      let r; try { r = JSON.parse(raw); } catch (e) { return reject(new Error('ตอบกลับไม่ถูกต้อง')); }
      if (r.ok) return resolve(r.data);
      if (r.error === 'SESSION_EXPIRED') { toast('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่', 'bad'); logout(true); return reject(new Error('หมดเวลาใช้งาน')); }
      const err = new Error(r.error); err.server = true; reject(err);
    };
    if (VIA_GAS) {
      google.script.run.withSuccessHandler(done).withFailureHandler(e => reject(new Error(e.message || 'เชื่อมต่อไม่สำเร็จ'))).api(action, ST.token, payload || {});
    } else if (REMOTE) {
      fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, token: ST.token, payload: payload || {} }) })
        .then(r => { if (!r.ok) throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด (' + r.status + ')'); return r.text(); })
        .then(done, e => reject(new Error(/เซิร์ฟเวอร์/.test(e.message) ? e.message : 'เชื่อมต่อไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต')));
    } else if (window.MOCK_API) window.MOCK_API(action, ST.token, payload || {}).then(done, reject);
    else reject(new Error('ไม่พบ backend'));
  });
}
function toast(msg, type) {

  $('#toast').appendChild(d); setTimeout(() => d.remove(), 3200);
}

/* ================= guard (โหมดส่งไว) ================= */
/* คิวส่งงานเบื้องหลัง: กดบันทึกแล้วขึ้นผลทันที ไม่ต้องรอเซิร์ฟเวอร์ ถ้าเน็ตหลุดจะส่งซ้ำให้เอง */
const OB = {
  q: [], sending: false, err: '', timer: null,
  load() { try { OB.q = JSON.parse(localStorage.getItem('sr_ob') || '[]'); } catch (e) { OB.q = []; } },
  save() { try { localStorage.setItem('sr_ob', JSON.stringify(OB.q)); } catch (e) { } },
  mine() { return ST.user ? OB.q.filter(i => i.sid === ST.user.id) : []; },
  drop(it) { const k = OB.q.indexOf(it); if (k >= 0) OB.q.splice(k, 1); },
  add(item) {
    item.uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    item.sid = ST.user.id;                       // ผูกกับ รปภ. ที่บันทึก — คนอื่นล็อกอินเครื่องเดียวกันจะไม่ส่งแทน
    item.payload.uid = item.uid; item.row.uid = item.uid;
    OB.q.push(item); OB.save(); OB.flush();
  },
  async flush() {
    if (OB.sending || !ST.user || ST.user.role !== 'guard' || !OB.mine().length) return;
    OB.sending = true; OB.err = ''; obBar();
    let cur = null;
    try {
      const batch = OB.mine().filter(i => i.type === 'patrol').slice(0, ST.info.maxBatch || 8);
      if (batch.length) {
        const res = await call('savePatrolBatch', { items: batch.map(i => i.payload) });
        cur = batch;
        batch.forEach(OB.drop);
        if (res.failed && res.failed.length) toast('ส่งไม่สำเร็จ ' + res.failed.length + ' รายการ: ' + res.failed[0].error + ' — กรุณาบันทึกใหม่', 'bad');
      }
      else { const it = OB.mine()[0]; cur = [it]; await call(it.type === 'water' ? 'saveWater' : 'saveIncident', it.payload); OB.drop(it); }
      OB.save(); OB.sending = false; obBar();
      if (OB.mine().length) return OB.flush();
      clearTimeout(ST.syncT); ST.syncT = setTimeout(() => loadGuard(true), 1200);
    } catch (e) {
      OB.sending = false;
      if (e.server && cur && !/lock|timeout|service|ล็อก|หมดเวลา|SESSION/i.test(e.message)) {
        cur.forEach(OB.drop); OB.save(); obBar(); renderGuard();          // ข้อมูลไม่ผ่านเงื่อนไข — ไม่ส่งซ้ำ ให้บันทึกใหม่
        toast('บันทึกไม่สำเร็จ: ' + e.message + ' — กรุณาบันทึกใหม่', 'bad');
        return OB.flush();
      }
      OB.err = e.message; obBar();
      clearTimeout(OB.timer); OB.timer = setTimeout(() => OB.flush(), 15000);
    }
  }
};
function obBar() {
  const el = $('#obBar'); if (!el) return;
  const n = OB.mine().length;
  if (!n) { el.className = 'ob hidden'; el.innerHTML = ''; return; }
  el.className = 'ob' + (OB.err ? ' bad' : '');
  el.innerHTML = OB.err
    ? '<span>' + ic('alert') + ' ยังส่งไม่สำเร็จ ' + n + ' รายการ (เก็บไว้ในเครื่องแล้ว)</span><button class="btn sm line" onclick="OB.flush()">ลองส่งอีกครั้ง</button>'
    : '<span><span class="dotspin"></span> กำลังส่ง ' + n + ' รายการ…</span>';
}
const pendRows = (t) => OB.mine().filter(i => i.type === t).map(i => Object.assign({ pending: 1 }, i.row));

async function loadGuard(silent) {
  try {
    ST.home = await call('guardHome');

  clearInterval(ST.timer);
  ST.timer = setInterval(() => { if ($('#modal').classList.contains('hidden') && !OB.mine().length) loadGuard(true); }, 60000);

function slotState(x, slot, idx) {
  const req = x.checkpoints.filter(cp => idx % cp.every === 0);
  const done = req.filter(cp => x._logs.some(l => l.slot === slot && l.cp_id === cp.cp_id && l.adhoc !== 'TRUE')).length;
  const h = Number(slot.slice(0, 2)), cur = x.ctx.hour;
  return { req: req.length, done, cls: h > cur ? 'fut' : h === cur ? 'cur' : done === req.length ? 'full' : done === 0 ? 'none' : 'part' };
}
/** จุดที่ยังไม่ได้ตรวจในรอบนี้ (เรียงตามลำดับเดินตรวจ) */
function pendingCps() {
  const x = ST.home, idx = x.slots.indexOf(x.ctx.slot);
  return x.checkpoints.filter((cp, i) => idx % cp.every === 0 && !x._logs.some(l => l.slot === x.ctx.slot && l.cp_id === cp.cp_id && l.adhoc !== 'TRUE'));
}
function camBtn(cpId, cls, label) {
  return '<label class="' + cls + '">' + label + '<input type="file" accept="image/*" capture="environment" onchange="quickShot(this,\'' + cpId + '\')"></label>';
}
function renderGuard() {
  const x = ST.home, c = x.ctx, idx = x.slots.indexOf(c.slot);
  x._logs = x.logs.concat(pendRows('patrol'));
  x._incs = x.incidents.concat(pendRows('incident'));
  x._water = (x.water || []).concat(pendRows('water'));
  const wTanks = x._water.reduce((a, w) => a + (Number(w.tanks) || 0), 0);
  const cur = slotState(x, c.slot, idx), pend = pendingCps();
  const pct = cur.req ? Math.round(cur.done * 100 / cur.req) : 100;
  const cards = x.checkpoints.map((cp, i) => {
    const logs = x._logs.filter(l => l.slot === c.slot && l.cp_id === cp.cp_id && l.adhoc !== 'TRUE');
    const need = idx % cp.every === 0;
    let cls = 'todo', st = '<span class="pill pri">' + ic('cam') + ' แตะเพื่อถ่าย</span>';
    if (logs.length) {
      const last = logs[logs.length - 1], bad = logs.some(l => l.status === 'ผิดปกติ');
      cls = bad ? 'bad' : 'done';
      st = last.pending ? '<span class="pill"><span class="dotspin"></span> กำลังส่ง</span>'
        : '<span class="pill ' + (bad ? 'bad' : 'ok') + '">' + (bad ? 'ผิดปกติ' : ic('check') + ' ตรวจแล้ว') + ' ' + hm(last.ts) + '</span>';
    } else if (!need) {
      cls = 'skip';
      const nxt = x.slots.find((s, j) => j > idx && j % cp.every === 0);
      st = '<span class="pill">ทุก ' + cp.every + ' ชม.' + (nxt ? ' · รอบ ' + nxt : '') + '</span>';

function tick() {

/* ---- รูปภาพ ---- */
function compressImage(file, label) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
      const d = new Date(), fs = Math.max(14, Math.round(cv.width / 34));
      const text = d.getDate() + '/' + (d.getMonth() + 1) + '/' + (d.getFullYear() + 543) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ' · ' + label;
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, cv.height - fs * 1.8, cv.width, fs * 1.8);
      g.fillStyle = '#fff'; g.font = '600 ' + fs + 'px Sarabun, sans-serif'; g.fillText(text, fs * .6, cv.height - fs * .6);
      URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg', 0.62));
    };
    img.onerror = () => reject(new Error('อ่านไฟล์รูปไม่ได้')); img.src = url;
  });
}

  const p = { category: f.category, severity: f.severity, location: $('#iLoc').value.trim(), detail: $('#iDetail').value.trim(), action: $('#iAction').value.trim(), photos: f.photos, ts: nowTs() };
  if (!p.category) return toast('กรุณาเลือกประเภทเหตุการณ์', 'bad');
  if (!p.location || p.detail.length < 3) return toast('กรุณาระบุสถานที่และรายละเอียด', 'bad');

}

  openModal('บันทึกเติมน้ำ',

function wStep(d) { const el = $('#wTanks'); el.value = Math.min(50, Math.max(1, (parseInt(el.value, 10) || 0) + d)); }
function submitWater(btn) {
  const loc = $('#wLoc').value.trim(), tanks = parseInt($('#wTanks').value, 10);
  if (!loc) return toast('กรุณาระบุจุดที่เติมน้ำ', 'bad');
  if (!(tanks >= 1 && tanks <= 50)) return toast('จำนวนถังต้องเป็น 1–50', 'bad');
  const p = { location: loc, tanks, ts: nowTs() };
  OB.add({ type: 'water', payload: p, row: Object.assign({}, p, { staff_name: ST.user.name, photos: '' }) });
  closeModal(); renderGuard(); toast('บันทึกเติมน้ำ ' + tanks + ' ถังแล้ว', 'ok');
}

/* ================= reports ================= */
async function previewReport(params) {
  openModal('กำลังสร้างรายงาน…', '<div class="spin"></div><div class="muted" style="text-align:center">กำลังรวบรวมข้อมูลและภาพถ่าย</div>', true);
  try {
    const r = await call('report', params);
    ST.lastReport = params;
    $('#mTitle').textContent = r.title;
    $('#mBody').innerHTML = '<div class="row"><button class="btn pri" onclick="printReport()">' + ic('file') + 'พิมพ์ / บันทึกเป็น PDF</button>' +
      '<button class="btn line" onclick="downloadPdf(this)">ดาวน์โหลดไฟล์ PDF (เก็บใน Drive)</button></div><iframe class="rep" id="repFrame"></iframe>';
    $('#repFrame').srcdoc = r.html;
  } catch (e) { $('#mTitle').textContent = 'สร้างรายงานไม่สำเร็จ'; $('#mBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
function printReport() { const f = $('#repFrame'); f.contentWindow.focus(); f.contentWindow.print(); }
async function downloadPdf(btn) {
  const t = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'กำลังสร้าง PDF…';
  try {
    const r = await call('makePdf', ST.lastReport);
    const bin = atob(r.base64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' })); a.download = r.filename;
    document.body.appendChild(a); a.click(); a.remove();
    toast('ดาวน์โหลดแล้ว และบันทึกสำเนาไว้ใน Google Drive', 'ok');
  } catch (e) { toast(e.message, 'bad'); } finally { btn.disabled = false; btn.innerHTML = t; }
}

async function saveStaff(btn, id) {
  await busy(btn, async () => {
    const list = await call('saveStaff', { staff_id: id, name: $('#sN').value, position: $('#sP').value, phone: $('#sT').value, pin: $('#sPin').value.trim() });

async function toggleStaff(btn, id, active) {

function confirmInline(btn) { if (btn.dataset.sure) return true; btn.dataset.sure = 1; btn.textContent = 'ยืนยัน?'; btn.classList.add('warn'); setTimeout(() => { if (btn.isConnected) { delete btn.dataset.sure; btn.textContent = 'ลบออก'; btn.classList.remove('warn'); } }, 3000); return false; }

/* ---- เครื่องที่อนุมัติ (ลงทะเบียนเครื่อง รปภ.) ---- */
async function tabDev(list) {
  list = list || await call('listDevices');
  const ST_TXT = { pending: ['รออนุมัติ', 'warn'], approved: ['อนุมัติแล้ว', 'ok'], revoked: ['ยกเลิกแล้ว', ''] };
  const row = d => '<tr class="' + (d.status === 'revoked' ? 'inactive' : '') + '"><td><b>' + esc(d.staff_name) + '</b><div class="muted small">' + esc(d.staff_id) + '</div></td>' +
    '<td><span class="pill pri" style="font-family:monospace;font-size:16px;letter-spacing:3px">' + esc(d.code) + '</span></td><td class="small">' + esc(d.ua || '-') + '</td>' +
    '<td class="small">ขอ ' + esc(d.created_at) + (d.approved_at ? '<br>อนุมัติ ' + esc(d.approved_at) + ' · ' + esc(d.approved_by) : '') + (d.last_seen ? '<br>ใช้ล่าสุด ' + esc(d.last_seen) : '') + '</td>' +
    '<td><span class="pill ' + ST_TXT[d.status][1] + '">' + ST_TXT[d.status][0] + '</span></td><td style="white-space:nowrap;text-align:right">' +
    (d.status !== 'approved' ? '<button class="btn pri sm" onclick="devAct(this,\'' + d.dev_id + '\',\'approveDevice\')">อนุมัติ</button> ' : '') +
    (d.status !== 'revoked' ? '<button class="btn line sm" onclick="devRevoke(this,\'' + d.dev_id + '\')">' + (d.status === 'pending' ? 'ปฏิเสธ' : 'ยกเลิกเครื่อง') + '</button>' : '') + '</td></tr>';
  const pend = list.filter(d => d.status === 'pending'), rest = list.filter(d => d.status !== 'pending');
  const head = '<tr><th>เจ้าหน้าที่</th><th>รหัสเครื่อง</th><th>อุปกรณ์</th><th>เวลา</th><th>สถานะ</th><th></th></tr>';
  $('#pane').innerHTML = '<div class="pane-hd"><h2>เครื่องที่ รปภ. ใช้เข้าระบบ</h2><button class="btn line" onclick="tabDev()">' + ic('refresh') + 'รีเฟรช</button></div>' +
    '<div class="card" style="margin-bottom:10px;background:var(--pri-50);border:0"><b>วิธีอนุมัติ:</b> รปภ. ใส่ PIN บนเครื่องใหม่ → หน้าจอขึ้นรหัสเครื่อง 4 ตัว → <b>เทียบรหัสกับหน้าจอของ รปภ. ให้ตรงกันก่อน</b> แล้วกดอนุมัติ · ' +
    'เครื่องหาย / ลาออก / เปลี่ยนเครื่อง ให้กด “ยกเลิกเครื่อง” (มีผลภายใน 1 นาที)</div>' +
    '<h3 class="sec"><span>รออนุมัติ (' + pend.length + ')</span></h3>' + (pend.length ? '<div class="tw"><table class="t">' + head + pend.map(row).join('') + '</table></div>' : '<div class="empty">ไม่มีเครื่องรออนุมัติ</div>') +
    '<h3 class="sec"><span>อนุมัติแล้ว / ยกเลิกแล้ว (' + rest.length + ')</span></h3>' + (rest.length ? '<div class="tw"><table class="t">' + head + rest.map(row).join('') + '</table></div>' : '<div class="empty">ยังไม่มี</div>');
}
async function devAct(btn, id, act) { await busy(btn, async () => { tabDev(await call(act, { dev_id: id })); toast(act === 'approveDevice' ? 'อนุมัติเครื่องแล้ว' : 'ยกเลิกเครื่องแล้ว', 'ok'); }); }
function devRevoke(btn, id) {
  if (!btn.dataset.sure) { btn.dataset.sure = 1; const t = btn.textContent; btn.textContent = 'ยืนยัน?'; btn.classList.add('warn'); setTimeout(() => { if (btn.isConnected) { delete btn.dataset.sure; btn.textContent = t; btn.classList.remove('warn'); } }, 3000); return; }
  devAct(btn, id, 'revokeDevice');
}

const MODE_TXT = { high: 'เฉพาะเหตุการณ์ระดับสูง/วิกฤต — ส่งทันที', all: 'ทุกรายการผิดปกติ — ส่งทันที', off: 'ไม่ส่งทันที (รวมในสรุปรายวันเท่านั้น)' };
async function tabNotify(cfg) {
  cfg = cfg || await call('notifyConfig');
  ST.ncfg = cfg;
  const hours = Array.from({ length: 24 }, (_, h) => '<option value="' + h + '"' + (h === cfg.dailyHour ? ' selected' : '') + '>' + p2(h) + ':10 น.</option>').join('');
  $('#pane').innerHTML = '<div class="pane-hd"><h2>แจ้งเตือนอีเมลผู้บริหาร</h2><div class="row">' +
    '<button class="btn line" onclick="testMail(this)">ส่งอีเมลทดสอบ</button>' +
    (window.MOCK_MAIL ? '<button class="btn line" onclick="showMockMail()">ดูอีเมลล่าสุด (เดโม)</button>' : '') +
    '<button class="btn pri" onclick="recForm()">' + ic('plus') + 'เพิ่มผู้รับ</button></div></div>' +
    (cfg.demo ? '<div class="card" style="background:#fff8e6;border-color:#e0ac3f;margin-bottom:10px">โหมดสาธิต: ระบบไม่ได้ส่งอีเมลจริง แต่สร้างเนื้อหาอีเมลให้ดูได้ด้วยปุ่ม “ดูอีเมลล่าสุด”</div>' : '') +
    '<div class="g2"><div class="card"><h3>เกณฑ์การส่ง</h3>' +
    '<label class="f"><input type="checkbox" id="nOn"' + (cfg.on ? ' checked' : '') + ' onchange="saveNotify()"> เปิดใช้งานการแจ้งเตือนอีเมล</label>' +
    '<label class="f">แจ้งทันทีเมื่อ</label><select class="in" id="nMode" onchange="saveNotify()">' +
    Object.keys(MODE_TXT).map(k => '<option value="' + k + '"' + (k === cfg.mode ? ' selected' : '') + '>' + MODE_TXT[k] + '</option>').join('') + '</select>' +
    '<label class="f"><input type="checkbox" id="nDaily"' + (cfg.dailyOn ? ' checked' : '') + ' onchange="saveNotify()"> ส่งสรุปรายวัน (รายการผิดปกติที่เหลือ + % ความครอบคลุมของเมื่อวาน)</label>' +
    '<label class="f">เวลาส่งสรุปรายวัน</label><select class="in" id="nHour" onchange="saveNotify()">' + hours + '</select>' +
    '<label class="f"><input type="checkbox" id="nMonthly"' + (cfg.monthlyOn ? ' checked' : '') + ' onchange="saveNotify()"> ส่งรายงานประจำเดือนเป็น PDF ทุกวันที่ 1 เวลา 07:30 น. (ภาพเฉพาะกรณีผิดปกติ)</label>' +
    '<label class="f">ลบรูป “กรณีปกติ” ที่เก่ากว่า</label><select class="in" id="nKeep" onchange="saveNotify()">' +
    [[0, 'ไม่ลบ (เก็บทุกรูป)'], [3, '3 เดือน'], [6, '6 เดือน'], [12, '12 เดือน'], [24, '24 เดือน']].map(o => '<option value="' + o[0] + '"' + (o[0] === cfg.keepMonths ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' +
    '<div class="muted small" style="margin-top:6px">รูปผิดปกติและเหตุการณ์เก็บถาวรเสมอ · รูปที่ลบย้ายไปถังขยะ Drive กู้คืนได้ 30 วัน · ข้อมูลการตรวจในชีตยังอยู่ครบ</div>' +
    '<div class="muted small" style="margin-top:10px">เหตุระดับสูง/วิกฤตจะส่งทันทีที่ รปภ. กดส่งรายงาน (ระบบตรวจซ้ำทุก 5 นาทีเผื่อส่งไม่สำเร็จ)</div></div>' +
    '<div class="card"><h3>สถานะ</h3><table class="t"><tr><td>รายการรอแจ้งเตือน</td><td class="b">' + cfg.pending + ' รายการ</td></tr>' +
    '<tr><td>โควตาอีเมลคงเหลือวันนี้</td><td class="b">' + cfg.quota + ' ฉบับ</td></tr>' +
    '<tr><td>ผู้รับที่ใช้งาน</td><td class="b">' + cfg.recipients.filter(r => r.active).length + ' คน</td></tr>' +
    '<tr><td>รายงานประจำเดือนที่ส่งล่าสุด</td><td class="b">' + (cfg.lastMonthly ? esc(monthTh(cfg.lastMonthly)) : '–') + '</td></tr></table>' +
    '<button class="btn soft block" style="margin-top:10px" onclick="runNotify(this)">ตรวจและส่งรายการที่ค้างเดี๋ยวนี้</button>' +
    '<button class="btn line block" style="margin-top:8px" onclick="runMonthly(this)">ส่งรายงานประจำเดือนที่แล้วตอนนี้ (PDF)</button></div></div>' +
    '<div class="tw" style="margin-top:10px"><table class="t"><tr><th>อีเมล</th><th>ชื่อ / ตำแหน่ง</th><th class="c">แจ้งทันที</th><th class="c">สรุปรายวัน</th><th class="c">รายเดือน (PDF)</th><th>สถานะ</th><th></th></tr>' +
    (cfg.recipients.map(r => '<tr class="' + (r.active ? '' : 'inactive') + '"><td>' + esc(r.email) + '</td><td><b>' + esc(r.name) + '</b>' + (r.note ? '<div class="muted small">' + esc(r.note) + '</div>' : '') + '</td>' +
      '<td class="c">' + (r.immediate ? '<span class="pill bad">ทันที</span>' : '–') + '</td><td class="c">' + (r.daily ? '<span class="pill pri">รายวัน</span>' : '–') + '</td><td class="c">' + (r.monthly ? '<span class="pill ok">รายเดือน</span>' : '–') + '</td>' +
      '<td>' + (r.active ? '<span class="pill ok">ใช้งาน</span>' : '<span class="pill">ปิด</span>') + '</td>' +
      '<td style="white-space:nowrap;text-align:right"><button class="btn line sm" onclick="recForm(\'' + esc(r.email) + '\')">แก้ไข</button> ' +
      '<button class="btn sm ' + (r.active ? 'line' : 'soft') + '" onclick="toggleRec(this,\'' + esc(r.email) + '\',' + !r.active + ')">' + (r.active ? 'ปิด' : 'เปิด') + '</button></td></tr>').join('')
      || '<tr><td colspan="7" class="muted">ยังไม่มีผู้รับอีเมล — กด “เพิ่มผู้รับ”</td></tr>') + '</table></div>';
}
function recForm(email) {
  const r = (ST.ncfg.recipients || []).find(x => x.email === email) || { immediate: true, daily: true, monthly: true, active: true };
  openModal(email ? 'แก้ไขผู้รับอีเมล' : 'เพิ่มผู้รับอีเมล',
    '<label class="f">อีเมล <span class="req">*</span></label><input class="in" id="rE" type="email" value="' + esc(r.email || '') + '"' + (email ? ' disabled' : '') + '>' +
    '<label class="f">ชื่อ / ตำแหน่ง</label><input class="in" id="rN" value="' + esc(r.name || '') + '" placeholder="เช่น ผู้อำนวยการ / หัวหน้างานบริหาร">' +
    '<label class="f"><input type="checkbox" id="rI"' + (r.immediate ? ' checked' : '') + '> รับแจ้งเตือนทันที (เหตุด่วน)</label>' +
    '<label class="f"><input type="checkbox" id="rD"' + (r.daily ? ' checked' : '') + '> รับสรุปรายวัน</label>' +
    '<label class="f"><input type="checkbox" id="rM"' + (r.monthly ? ' checked' : '') + '> รับรายงานประจำเดือน (PDF แนบอีเมล)</label>' +
    '<label class="f"><input type="checkbox" id="rA"' + (r.active !== false ? ' checked' : '') + '> เปิดใช้งาน</label>' +
    '<button class="btn pri block" style="margin-top:16px" onclick="saveRec(this)">บันทึก</button>');
}
async function saveRec(btn) {
  await busy(btn, async () => {
    const cfg = await call('saveRecipient', { email: $('#rE').value, name: $('#rN').value, immediate: $('#rI').checked, daily: $('#rD').checked, monthly: $('#rM').checked, active: $('#rA').checked });
    closeModal(); tabNotify(cfg); toast('บันทึกผู้รับแล้ว', 'ok');
  });
}
async function toggleRec(btn, email, active) { await busy(btn, async () => tabNotify(await call('deleteRecipient', { email, active }))); }
async function saveNotify() {
  try {
    const cfg = await call('saveNotifySettings', { on: $('#nOn').checked, mode: $('#nMode').value, dailyOn: $('#nDaily').checked, dailyHour: $('#nHour').value, monthlyOn: $('#nMonthly').checked, keepMonths: $('#nKeep').value });
    ST.ncfg = cfg; toast('บันทึกการตั้งค่าแล้ว', 'ok');
  } catch (e) { toast(e.message, 'bad'); }
}
async function testMail(btn) { await busy(btn, async () => { const r = await call('testMail', {}); toast('ส่งอีเมลทดสอบไปที่ ' + r.sent, 'ok'); }); }
async function runNotify(btn) { await busy(btn, async () => { const r = await call('runNotifyNow', {}); toast('ส่งแจ้งเตือน ' + r.sent + ' ฉบับ', 'ok'); tabNotify(); }); }
const monthTh = (ym) => { const [y, m] = String(ym).split('-').map(Number); return ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'][m - 1] + ' ' + (y + 543); };
async function runMonthly(btn) {
  await busy(btn, async () => { const r = await call('runMonthlyNow', {}); toast('ส่งรายงาน' + monthTh(r.month) + ' ถึง ' + r.to + ' แล้ว', 'ok'); tabNotify(); });
}
function showMockMail() {
  const m = window.MOCK_MAIL || [];
  if (!m.length) return toast('ยังไม่มีอีเมลในเดโม — ลองแจ้งเหตุระดับสูง/วิกฤต หรือกดส่งอีเมลทดสอบ', 'bad');
  const last = m[m.length - 1];
  openModal('ตัวอย่างอีเมล (เดโม)', '<div class="muted small">ถึง: ' + esc(last.to) + '<br>เรื่อง: <b>' + esc(last.subject) + '</b>' + ((last.attachments || []).length ? '<br>ไฟล์แนบ: ' + esc(last.attachments.map(a => a.filename).join(', ')) : '') + '</div><iframe class="rep" id="repFrame"></iframe>', true);
  $('#repFrame').srcdoc = '<meta charset="utf-8"><body style="font-family:Sarabun,sans-serif">' + last.html + '</body>';
}

/* ---- users ---- */
async function tabUsers(list) {
  list = list || await call('listUsers'); ST.users = list;
  $('#pane').innerHTML = '<div class="pane-hd"><h2>ผู้ใช้ระบบ (ผู้ดูแล / ผู้บริหาร)</h2><button class="btn pri" onclick="userForm()">' + ic('plus') + 'เพิ่มผู้ใช้</button></div>' +
    '<div class="tw"><table class="t"><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>บทบาท</th><th>สถานะ</th><th></th></tr>' +
    list.map(u => '<tr class="' + (u.active ? '' : 'inactive') + '"><td>' + esc(u.username) + '</td><td><b>' + esc(u.name) + '</b></td><td>' + (u.role === 'admin' ? '<span class="pill pri">ผู้ดูแลระบบ</span>' : '<span class="pill">ผู้บริหาร</span>') + '</td><td>' +
      (u.active ? '<span class="pill ok">ใช้งาน</span>' : '<span class="pill">ปิด</span>') + '</td><td style="text-align:right"><button class="btn line sm" onclick="userForm(\'' + esc(u.username) + '\')">แก้ไข / รีเซ็ตรหัส</button></td></tr>').join('') + '</table></div>' +
    '<p class="muted small">ผู้บริหาร: ดูภาพรวม รายการผิดปกติ บันทึกข้อสั่งการ และพิมพ์รายงาน · ผู้ดูแลระบบ: ทำได้ทั้งหมด</p>' +
    '<div class="card" id="goLiveCard" style="margin-top:14px"><div class="spin"></div></div>';
  const si = await call('systemInfo');
  const tabs = si.testTabs.filter(t => t.rows);
  $('#goLiveCard').innerHTML = '<h3>' + ic('check') + ' เริ่มใช้งานจริง ' + thD(si.goLiveDate) + '</h3>' +
    (si.liveSince ? '<div class="pill ok">เริ่มใช้งานจริงแล้ว · ' + esc(si.liveSince) + '</div>' : '') +
    '<p class="small">ย้ายข้อมูลทดสอบก่อนวันที่ ' + thD(si.goLiveDate) + ' ออกจากระบบ (เปลี่ยนชื่อแท็บเป็น “…_ทดสอบ” ไม่ลบ) และย้ายรูปทดสอบลงถังขยะ Drive — ข้อมูลตั้งแต่ ' + thD(si.goLiveDate) + ' ไม่ถูกแตะ · ไม่ส่งรายงานประจำเดือนของข้อมูลทดสอบ</p>' +
    '<p class="small">ข้อมูลทดสอบที่พบ: <b>' + (tabs.length ? tabs.map(t => esc(t.name) + ' ' + t.rows + ' แถว').join(' · ') : 'ไม่มี') + '</b></p>' +
    '<div class="row"><input class="in" id="glC" style="max-width:260px" placeholder="พิมพ์: เริ่มใช้งานจริง"><button class="btn pri" onclick="goLive(this)">ย้ายข้อมูลทดสอบ & เริ่มใช้งานจริง</button></div>';
}
async function goLive(btn) {
  await busy(btn, async () => {
    const r = await call('goLive', { confirm: $('#glC').value });
    toast('ย้ายข้อมูลทดสอบแล้ว: ' + (r.moved.join(', ') || 'ไม่มี') + ' · รูป ' + r.trashed + ' รูป', 'ok');
    tabUsers();
  });
}
function userForm(un) {
  const u = (ST.users || []).find(x => x.username === un) || { role: 'exec', active: true };
  openModal(un ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้',
    '<label class="f">ชื่อผู้ใช้ <span class="req">*</span></label><input class="in" id="uU" value="' + esc(u.username || '') + '"' + (un ? ' disabled' : '') + '>' +
    '<label class="f">ชื่อ-สกุล</label><input class="in" id="uN" value="' + esc(u.name || '') + '">' +
    '<label class="f">บทบาท</label><select class="in" id="uR"><option value="exec"' + (u.role === 'exec' ? ' selected' : '') + '>ผู้บริหาร</option><option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>ผู้ดูแลระบบ</option></select>' +
    '<label class="f">รหัสผ่าน ' + (un ? '(เว้นว่าง = ไม่เปลี่ยน)' : '<span class="req">*</span>') + '</label><input class="in" id="uP" type="password" placeholder="อย่างน้อย 8 ตัวอักษร">' +
    '<label class="f">PIN ' + (un ? '(เว้นว่าง = ไม่เปลี่ยน)' : '<span class="req">*</span>') + '</label><input class="in" id="uPin" inputmode="numeric" maxlength="6" placeholder="ตัวเลข 6 หลัก">' +
    '<label class="f"><input type="checkbox" id="uA"' + (u.active ? ' checked' : '') + '> เปิดใช้งาน</label>' +
    '<button class="btn pri block" style="margin-top:18px" onclick="saveUser(this)">บันทึก</button>');
}
async function saveUser(btn) {
  await busy(btn, async () => { const list = await call('saveUser', { username: $('#uU').value, name: $('#uN').value, role: $('#uR').value, password: $('#uP').value, pin: $('#uPin').value.trim(), active: $('#uA').checked }); closeModal(); tabUsers(list); toast('บันทึกแล้ว', 'ok'); });
}

init();
</script>
</body>
</html>
